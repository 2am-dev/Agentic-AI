version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./shared/workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_HOST=host.docker.internal:11434
      - SANDBOX_IMAGE=codegen-sandbox
      - WORKSPACE_PATH=/workspace
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codegen-net
    depends_on:
      - sandbox-builder

  sandbox-builder:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: codegen-sandbox
    command: echo "Sandbox image built"
    networks:
      - codegen-net

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - codegen-net

networks:
  codegen-net:
    driver: bridge

volumes:
  workspace:
